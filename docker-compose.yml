
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripod-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripod-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
